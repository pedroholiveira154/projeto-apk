
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Comandos Docker</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Comandos básicos</h1>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Verificar a versão</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <code>docker --version</code>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Listar containers ativos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <code>docker ps</code>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Listar imagens</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <code>docker images</code>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Baixar uma imagem</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <code>docker pull nginx</code>
    </ion-card-content>
  </ion-card>
</ion-content>
